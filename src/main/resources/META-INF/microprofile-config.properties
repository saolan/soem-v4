# ==============================================================================
# Configuracion MicroProfile para el mecanismo de autenticacion MP-JWT y CORS.
# Los valores de firma/verificacion de JWT apuntan por defecto al par de
# claves "dev" (ver META-INF/dev/LEEME.txt): validos solo para desarrollo
# local. Todo entorno real (staging/produccion) debe sobreescribirlos sin
# recompilar via variables de entorno o propiedades de sistema (MP Config las
# prioriza sobre este archivo), p. ej. MP_JWT_VERIFY_PUBLICKEY_LOCATION,
# SMALLRYE_JWT_SIGN_KEY_LOCATION, SOEM_CORS_ORIGEN_PERMITIDO.
# ==============================================================================

# Origen unico habilitado para CORS (nunca "*" en produccion, segun AGENTS.md).
soem.cors.origen-permitido=http://localhost:5173

# Ubicacion de la clave publica usada para verificar la firma del access
# token. Apunta por defecto al par de claves "dev" (ver
# META-INF/dev/LEEME.txt): NUNCA usar este valor en staging/produccion,
# sobreescribir siempre via la variable de entorno MP_JWT_VERIFY_PUBLICKEY_LOCATION.
mp.jwt.verify.publickey.location=/META-INF/dev/public-dev.pem

# Emisor esperado en el claim "iss" del token.
mp.jwt.verify.issuer=soem

# Ubicacion de la clave privada usada por TokenServicio (smallrye-jwt-build)
# para firmar el access token emitido en el login. Mismo par "dev" que la
# clave publica de arriba; sobreescribir via SMALLRYE_JWT_SIGN_KEY_LOCATION
# en cualquier entorno real.
smallrye.jwt.sign.key.location=/META-INF/dev/private-dev.pem

# Duracion del access token, segun el maximo de 15 minutos exigido por AGENTS.md.
soem.jwt.access-token.duracion-minutos=15

# Vencimiento por inactividad del refresh token (ventana deslizante: cada
# emision o rotacion lo fija en ahora + este valor). 30 minutos del frontend
# + 5 de margen, para que el usuario vea siempre el aviso del frontend antes
# de que el servidor rechace la renovacion. Sin maximo absoluto de sesion.
soem.jwt.refresh-token.inactividad-minutos=35

# Segundos sin uso tras los que el frontend cierra la sesion; se informa en
# LoginRespuestaDTO.inactividadSegundos (login, refresh, cambio de sucursal y
# cambio de clave). Debe ser menor que soem.jwt.refresh-token.inactividad-minutos.
soem.jwt.sesion.inactividad-segundos=1800

# Margen en segundos durante el que un refresh token recien rotado se rechaza
# con 401 sin tratarse como reuso (dos pestanas o una recarga durante la
# renovacion), para no revocar todas las sesiones por una carrera legitima.
# 0 desactiva el margen.
soem.jwt.refresh-token.gracia-reuso-segundos=30

# Dias que se conservan los refresh tokens ya expirados (auditoria de sesiones)
# antes de que la purga diaria (PurgaRefreshTokenProgramador) los borre.
soem.jwt.refresh-token.retencion-dias=30

# Tomar la IP de origen del encabezado X-Forwarded-For. Activar SOLO si WildFly
# esta detras de un proxy inverso confiable que sobrescribe ese encabezado; de
# lo contrario el cliente podria falsificar la IP registrada.
soem.seguridad.confiar-x-forwarded-for=false
